[pytest]
testpaths = tests
pythonpath = src
# La suite di default e' quella veloce. Gli e2e (tests/e2e/, marker `e2e`)
# passano dalla CLI vera e, dove il submodule engine c'e', renderizzano audio:
# girano con `make e2e-tests`, o con `pytest -m e2e`. I test `brano` rendono il
# brano intero piu' volte (minuti, gigabyte di grani): solo `make brano-tests`.
addopts = -q -m "not e2e and not brano"
markers =
    e2e: end-to-end sull'intera pipeline (CLI + render). Fuori da `make tests`.
    brano: identita' di grani e audio sul brano intero (#8). Solo `make brano-tests`.
filterwarnings =
    ignore::DeprecationWarning
