[pytest]
testpaths = tests
pythonpath = src
# La suite di default e' quella veloce. Gli e2e (tests/e2e/, marker `e2e`)
# passano dalla CLI vera e, dove il submodule engine c'e', renderizzano audio:
# girano con `make e2e-tests`, o con `pytest -m e2e`.
addopts = -q -m "not e2e"
markers =
    e2e: end-to-end sull'intera pipeline (CLI + render). Fuori da `make tests`.
filterwarnings =
    ignore::DeprecationWarning
