<!doctype html>
<meta charset="utf-8"><title>__TITLE__</title>
<style>
 :root { color-scheme: light dark; --bg:#fff; --fg:#111; --line:#bbb; --dim:#888; --on:#c33;
         --panel:#f4f4f4; }
 @media (prefers-color-scheme: dark) {
   :root { --bg:#141414; --fg:#eee; --line:#444; --dim:#888; --panel:#1c1c1c; } }
 body { background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,monospace;
        margin:0; display:flex; align-items:stretch; height:100vh; overflow:hidden; }
 #left { flex:0 0 auto; width:52%; min-width:220px; padding:22px; overflow:auto; }
 #right { flex:1 1 0; min-width:260px; padding:22px 22px 22px 0; overflow:auto; }
 /* Divisore trascinabile. La larghezza vive in localStorage, cosi' la
    proporzione fra griglia e analisi resta quella scelta. */
 #gutter { flex:0 0 9px; cursor:col-resize; background:var(--panel);
           border-left:1px solid var(--line); border-right:1px solid var(--line); }
 #gutter:hover, #gutter.drag { background:var(--line); }
 body.dragging { user-select:none; cursor:col-resize; }
 h1 { font-size:14px; font-weight:600; margin:0 0 14px; }
 .sel { display:grid; grid-template-columns:max-content 1fr; gap:4px 10px; align-items:center;
        margin-bottom:18px; }
 .sel .k { color:var(--dim); text-align:right; }
 .sel button { font:inherit; color:inherit; background:none; border:1px solid var(--line);
               padding:1px 8px; margin-right:4px; cursor:pointer; }
 .sel button.on { border-color:var(--fg); background:var(--fg); color:var(--bg); }
 .sel button:disabled { opacity:.25; cursor:default; }
 table { border-collapse:collapse; }
 th { font-weight:400; color:var(--dim); padding:2px 8px 2px 0; text-align:right; white-space:nowrap; }
 td { padding:0; text-align:center; }
 /* La colonna e' larga quanto serve alla piu' lunga delle etichette X, uguale
    per tutte: i numeri sotto la griglia restano equidistanziati e leggibili.
    --cw lo calcola drawGrid in caratteri (font monospace, unita' ch). */
 #grid { overflow-x:auto; }
 col.v { width:calc(var(--cw) * 1ch + 10px); }
 .cell { width:32px; height:32px; border:1px solid var(--line); background:none;
         color:inherit; font:inherit; cursor:pointer; padding:0; }
 .cell:hover { border-color:var(--fg); }
 .cell.on { background:var(--on); border-color:var(--on); }
 .cell.void { border-style:dotted; opacity:.25; cursor:default; }
 .xlab { font-size:10px; color:var(--dim); text-align:center; padding-top:5px; white-space:nowrap; }
 #now { margin-top:18px; min-height:3em; }
 #now .file { color:var(--dim); word-break:break-all; }
 audio { margin-top:6px; width:340px; display:block; }
 #transport { margin-top:6px; font-size:12px; color:var(--dim); }
 #transport label { margin-right:14px; cursor:pointer; }
 #transport input { vertical-align:-1px; margin-right:3px; }

 /* --- pannello di analisi ------------------------------------------------ */
 .view { position:relative; margin-bottom:10px; background:var(--panel); }
 .view canvas { display:block; width:100%; }
 .view .lab { position:absolute; top:3px; left:6px; font-size:10px; color:var(--dim);
              pointer-events:none; text-shadow:0 0 3px var(--panel); }
 /* Il cursore e' un semplice div: nessun ridisegno del canvas per muoverlo. */
 .cur { position:absolute; top:0; bottom:0; width:1px; background:var(--on);
        pointer-events:none; left:0; }
 .seek { cursor:col-resize; }
 /* I breakpoint proiettati sull'audio: giallo, per non confonderli col
    cursore di riproduzione (rosso). Si vedono solo quando quello che suona
    e' il render del laboratorio — su un file della griglia non vorrebbero
    dire niente. */
 .bpm { position:absolute; top:0; bottom:0; width:1px; background:#e8c000;
        opacity:.55; pointer-events:none; }
 .bpm.on { opacity:1; width:2px; }
 .bpm i { position:absolute; top:1px; left:2px; font-size:9px; font-style:normal;
          color:#e8c000; text-shadow:0 0 3px #000; }
 /* Il loop sul sample: si disegna trascinando sulla forma d'onda, gli estremi
    si prendono per allargarlo o stringerlo. Doppio click lo toglie. */
 .loopr { position:absolute; top:0; bottom:0; background:rgba(74,158,255,.18);
          border-left:2px solid #4a9eff; border-right:2px solid #4a9eff; pointer-events:none; }
 .loopr b { position:absolute; top:0; bottom:0; width:10px; cursor:ew-resize; pointer-events:auto; }
 .loopr b.a { left:-6px; } .loopr b.b { right:-6px; }
 .pair { display:flex; gap:10px; }
 .pair .view { flex:1 1 0; margin-bottom:0; }
 .pair .view:last-child { flex:0 0 auto; }
 #status { color:var(--dim); font-size:11px; min-height:1.4em; }
 #ctl { margin-bottom:8px; font-size:12px; }
 #ctl .k { color:var(--dim); margin-right:6px; }
 #ctl span + span { margin-left:4px; }
 #ctl button { font:inherit; color:inherit; background:none; border:1px solid var(--line);
               padding:0 6px; margin-right:3px; cursor:pointer; }
 #ctl button.on { border-color:var(--fg); background:var(--fg); color:var(--bg); }
 #ctl #res { margin-right:14px; }

 /* --- laboratorio del singolo stream ------------------------------------- */
 #tabs { margin-bottom:14px; }
 #tabs button { font:inherit; color:var(--dim); background:none; border:none;
                border-bottom:2px solid transparent; padding:2px 0; margin-right:16px;
                cursor:pointer; }
 #tabs button.on { color:var(--fg); border-bottom-color:var(--on); }
 #lab .row { display:grid; grid-template-columns:max-content 1fr; gap:4px 10px;
             align-items:center; margin-bottom:4px; }
 /* Terza colonna: il tipo di interpolazione, largo uguale per tutti cosi' i
    menu restano incolonnati riga dopo riga. */
 #labParams .row, #labParams .row.capo { grid-template-columns:max-content 1fr 7.5em; }
 #labParams .row.capo select { border-color:var(--fg); }
 #labParams .capo .k { color:var(--fg); }
 /* Il livello piu' largo: scrive su tutti i punti, quindi si vede che e'
    un'altra cosa rispetto ai due sotto. */
 #labParams .capo2 select { border-color:var(--on); }
 #labParams .capo2 .k { color:var(--on); }
 #labParams .capo2 { margin-bottom:8px; }
 #labFixed .row.audio { grid-template-columns:max-content 1fr max-content; }
 #labFixed .row.audio button { font:inherit; color:inherit; background:none;
                               border:1px solid var(--line); padding:1px 8px;
                               margin-left:6px; cursor:pointer; }
 #labFixed .row.audio button:hover { border-color:var(--fg); }
 #lab .row .k { color:var(--dim); text-align:right; white-space:nowrap; }
 #lab select, #lab input { font:inherit; color:inherit; background:var(--panel);
                           border:1px solid var(--line); padding:1px 4px; }
 #lab input[type=text], #lab input[type=number] { width:9em; }
 #lab h2 { font-size:12px; font-weight:600; color:var(--dim); margin:16px 0 6px;
           text-transform:lowercase; }
 #lab .bar { margin:10px 0; }
 #lab #fBar { margin:0 0 14px; padding-bottom:10px; border-bottom:1px solid var(--line); }
 #lab .bar button { font:inherit; color:inherit; background:none;
                    border:1px solid var(--line); padding:2px 10px; margin-right:6px;
                    cursor:pointer; }
 #lab .bar button:hover { border-color:var(--fg); }
 #lab .bar button:disabled { opacity:.35; cursor:default; border-color:var(--line); }
 /* La linea dei breakpoint: una dimensione sola, il tempo. Il punto si
    trascina, e cliccandolo i select tornano ai valori di quel preset. */
 #tl { position:relative; height:38px; margin:14px 0 6px; border-bottom:1px solid var(--line);
       touch-action:none; }
 #tl .bp { position:absolute; bottom:-6px; width:11px; height:11px; margin-left:-6px;
           border:1px solid var(--fg); background:var(--bg); border-radius:50%;
           cursor:grab; }
 #tl .bp.on { background:var(--on); border-color:var(--on); }
 #tl .bp .t { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
              font-size:10px; color:var(--dim); white-space:nowrap; }
 /* Le finestre: il nome da solo non dice niente, la forma si'. */
 #envs { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 4px; }
 #envs button { font:inherit; color:inherit; background:none; border:1px solid var(--line);
                padding:3px 5px 1px; cursor:pointer; line-height:1; }
 #envs button:hover { border-color:var(--fg); }
 #envs button.on { border-color:var(--on); }
 #envs button.on svg { stroke:var(--on); }
 #envs svg { display:block; stroke:var(--fg); fill:none; stroke-width:1.2; }
 #envs .n { font-size:9px; color:var(--dim); display:block; margin-top:2px;
            text-align:center; }
 #envs button.on .n { color:var(--fg); }
 #fFile { color:var(--dim); font-size:11px; margin-left:6px; }
 #fFile.dirty::after { content:" •  modificato"; color:var(--on); }
 #labInfo { color:var(--dim); font-size:11px; min-height:1.4em; margin-top:4px; }
 #labYaml { white-space:pre; font-size:11px; color:var(--dim); margin-top:10px;
            max-height:12em; overflow:auto; }
</style>

<div id="left">
  <div id="tabs">
    <button id="tabGrid" class="on">griglia</button><button id="tabLab">laboratorio</button>
  </div>
  <div id="griglia">
  <h1 id="h"></h1>
  <div class="sel" id="sel"></div>
  <div id="grid"></div>
  </div>

  <!-- Il laboratorio: si compone UNO stream, breakpoint per breakpoint, e lo
       si rende al volo. La griglia esplora combinazioni gia' rese; qui si
       scrive il documento che poi va nella timeline di PGE-ui. -->
  <div id="lab" hidden>
    <div class="bar" id="fBar">
      <button id="fNew">nuovo</button>
      <button id="fOpen">apri…</button>
      <button id="fSave">salva</button>
      <button id="fSaveAs">salva con nome…</button>
      <span id="fFile"></span>
    </div>
    <div id="labFixed"></div>
    <h2>parametri</h2>
    <div id="labParams"></div>
    <div class="bar">
      <button id="bpAdd">+ breakpoint</button>
      <button id="bpSave">salva modifica</button>
      <button id="bpAll" title="scrive i soli valori che hai appena cambiato su tutti i breakpoint">applica a tutti</button>
      <button id="bpDel">togli</button>
      <button id="labRender">rendi e ascolta</button>
    </div>
    <div id="tl"></div>
    <div id="labInfo"></div>
    <div id="labYaml"></div>
  </div>

  <div id="now"></div>
  <audio id="a" controls></audio>
  <div id="transport">
    <label><input type="checkbox" id="hold"> continua dal punto in cui era</label>
    <label><input type="checkbox" id="loop"> loop</label>
    <label title="ritardo fra l'audio prodotto e quello che senti: il cursore resta indietro di tanto">latenza <input type="number" id="lat" min="0" max="1000" step="5" style="width:4.5em"> ms</label>
  </div>
</div>

<div id="gutter" title="trascina per ridimensionare"></div>

<div id="right">
  <div id="ctl">
    <span class="k">scala</span><span id="scale"></span>
    <span class="k">risoluzione</span><span id="res"></span>
  </div>
  <div class="view seek" id="specView">
    <canvas id="spec" height="320"></canvas>
    <div class="lab">sonogramma — x tempo, y frequenza (log)</div>
    <div class="cur" id="curSpec"></div>
  </div>
  <div class="view seek" id="waveView">
    <canvas id="wave" height="180"></canvas>
    <div class="lab">forma d'onda — sul sample: trascina per il loop, doppio click lo toglie</div>
    <div class="cur" id="curWave"></div>
  </div>
  <div class="pair">
    <div class="view">
      <canvas id="scope" height="180"></canvas>
      <div class="lab">spectroscope — x frequenza (log), y dinamica (dB)</div>
    </div>
    <div class="view">
      <canvas id="stereo" width="180" height="180"></canvas>
      <div class="lab">stereoscope</div>
    </div>
  </div>
  <div id="status"></div>
</div>

<script>
const D = __DATA__;
// Vero quando l'audio caricato e' il render del laboratorio: solo allora i
// breakpoint si possono proiettare sul sonogramma (vedi `marcaAudio`).
let LAB_AUDIO = false;
// Vero quando suona un sample (`ascolta`): solo li' la forma d'onda e' il
// sample stesso, e una regione disegnata sopra e' un loop_start/loop_end.
let SAMPLE_AUDIO = false;
const byLabel = {};
for (const c of D.combos) byLabel[c.label] = c;

// Senza audio su disco (studio appena ripulito) la griglia e' vuota e la
// pagina resta utile lo stesso: c'e' il laboratorio.
const VUOTA = {label:"", sel:{}, axX:"", axY:"", xs:[], ys:[0], nodes:[], at:{}};
let sel = Object.assign({}, (D.combos[0] || VUOTA).sel);
let cur = D.combos[0] || VUOTA;
let cx = 0, cy = 0;

function match(s) {
  return D.combos.find(c => D.keys.every(k => c.sel[k] === s[k]));
}

function drawSel() {
  const box = document.getElementById("sel");
  box.innerHTML = "";
  for (const k of D.keys) {
    const kd = document.createElement("div");
    kd.className = "k"; kd.textContent = k;
    const vd = document.createElement("div");
    for (const v of D.values[k]) {
      const b = document.createElement("button");
      b.textContent = v;
      if (sel[k] === v) b.classList.add("on");
      // Disabilitato se cambiando SOLO questa chiave non esiste una
      // combinazione renderizzata: il disco decide cosa e' raggiungibile.
      const probe = Object.assign({}, sel); probe[k] = v;
      if (!match(probe)) b.disabled = true;
      else b.onclick = () => { sel[k] = v; show(match(sel)); };
      vd.appendChild(b);
    }
    box.appendChild(kd); box.appendChild(vd);
  }
}

function key(x, y) { return x + "|" + y; }

// Etichette: cinque decimali, senza zeri di coda. `0.000020833333333333333`
// diventa `0.00002` — il valore esatto resta nel nome del file, che e' la
// fonte di verita'. Sotto i cinque decimali si passa all'esponenziale invece
// di mostrare uno zero che sarebbe falso.
function fmt(v) {
  if (typeof v === "string") return v;   // asse categoriale (grain.envelope)
  if (v === 0) return "0";
  const r = Number(v.toFixed(5));
  return r === 0 ? v.toExponential(1) : String(r);
}

function drawGrid() {
  const at = {};
  for (const n of cur.nodes) at[key(n.coords[cur.axX], cur.axY ? n.coords[cur.axY] : 0)] = n;
  cur.at = at;
  const t = document.createElement("table");
  const labels = cur.xs.map(fmt);
  t.style.setProperty("--cw", Math.max(...labels.map(l => l.length)));
  // Una <col> per colonna: la larghezza vale sia per le celle sia per le
  // etichette, cosi' le due file restano allineate.
  const cg = document.createElement("colgroup");
  cg.appendChild(document.createElement("col"));
  for (let i = 0; i < cur.xs.length; i++) {
    const c = document.createElement("col");
    c.className = "v";
    cg.appendChild(c);
  }
  t.appendChild(cg);
  // Riga per riga dall'alto: y cresce verso l'alto, come su un grafico.
  for (let j = cur.ys.length - 1; j >= 0; j--) {
    const tr = t.insertRow();
    const th = document.createElement("th");
    th.textContent = cur.axY ? fmt(cur.ys[j]) : "";
    tr.appendChild(th);
    for (let i = 0; i < cur.xs.length; i++) {
      const b = document.createElement("button");
      b.className = "cell";
      const n = at[key(cur.xs[i], cur.ys[j])];
      if (!n) { b.classList.add("void"); b.disabled = true; }
      else { b.title = n.name; b.onclick = () => go(i, j); }
      b.dataset.i = i; b.dataset.j = j;
      tr.insertCell().appendChild(b);
    }
  }
  const foot = t.insertRow();
  foot.appendChild(document.createElement("th"));
  for (const l of labels) {
    const td = foot.insertCell();
    td.className = "xlab";
    td.textContent = l;
  }
  const box = document.getElementById("grid");
  box.innerHTML = "";
  box.appendChild(t);
}

const audio = document.getElementById("a");
const status = document.getElementById("status");

function go(i, j, play) {
  if (!cur.xs.length) return;
  // Suona un file della griglia: i breakpoint non c'entrano piu' niente.
  LAB_AUDIO = SAMPLE_AUDIO = false;
  marcaAudio();
  const n = cur.at[key(cur.xs[i], cur.ys[j])];
  cx = i; cy = j;
  // Posizione e stato del trasporto PRIMA di cambiare file: con "continua"
  // attivo il confronto fra due grani si fa restando fermi nel tempo, che e'
  // l'unico modo di sentire la differenza invece della partenza.
  const wasAt = audio.currentTime, wasPlaying = !audio.paused;
  for (const b of document.querySelectorAll(".cell")) b.classList.remove("on");
  const b = document.querySelector(`.cell[data-i="${i}"][data-j="${j}"]`);
  if (b) b.classList.add("on");
  if (!n) { document.getElementById("now").textContent = "(non renderizzato)"; return; }
  document.getElementById("now").innerHTML =
    "<b>" + cur.axX + " = " + fmt(cur.xs[i]) + "</b>" +
    (cur.axY ? " &nbsp; <b>" + cur.axY + " = " + fmt(cur.ys[j]) + "</b>" : "") +
    "<br><span class='file'>" + n.name + "</span>";
  audio.src = n.src;
  if (hold.checked) {
    // La durata non c'e' finche' il file non e' caricato, e la posizione va
    // limitata a quella: le clip di una griglia hanno la stessa durata, ma
    // fra griglie diverse no.
    audio.addEventListener("loadedmetadata", () => {
      audio.currentTime = Math.min(wasAt, audio.duration || wasAt);
      if (wasPlaying) audio.play();
    }, {once: true});
  } else if (play !== false) {
    audio.play();
  }
  analyse(n.src);
}

function show(c) {
  if (!c) return;
  cur = c;
  document.getElementById("h").textContent =
    D.study + "   " + cur.axX + (cur.axY ? " x " + cur.axY : "");
  drawSel();
  drawGrid();
  // La cella resta dov'era, clampata alla nuova griglia: cambiare un asse
  // esterno e' un A/B sullo stesso punto, non un salto altrove.
  go(Math.min(cx, cur.xs.length - 1), Math.min(cy, cur.ys.length - 1), false);
}

addEventListener("keydown", e => {
  // I bottoni tengono il focus dopo un click, e col focus la barra spaziatrice
  // li ripremerebbe invece di comandare il trasporto.
  if (e.target.tagName === "BUTTON") e.target.blur();
  if (e.key === " ") {
    e.preventDefault();
    if (audio.paused) audio.play(); else audio.pause();
    return;
  }
  const d = {ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowUp:[0,1], ArrowDown:[0,-1]}[e.key];
  if (!d) return;
  e.preventDefault();
  go(Math.min(cur.xs.length - 1, Math.max(0, cx + d[0])),
     Math.min(cur.ys.length - 1, Math.max(0, cy + d[1])));
});


// ===========================================================================
// Laboratorio: comporre UNO stream e sentirlo, invece di scegliere fra audio
// gia' resi. Ogni breakpoint e' uno snapshot di tutti i parametri a un tempo;
// il documento YAML lo ricava da se', mettendo una lista di punti solo dove
// il valore cambia davvero (vedi `serie`).
const L = D.lab || {base:{}, params:[]};
// I tre tipi che l'engine conosce (InterpolationStrategyFactory). Il tipo sta
// sul punto e vale per il segmento che PARTE da li'; l'ultimo non ne ha uno.
const INTERP = ["linear", "cubic", "step"];
const NUM = L.params.filter(p => p.kind === "num");
// `grain.envelope` si automatizza come gli altri, ma il suo valore e' un nome
// e non un numero: l'engine non interpola fra due finestre, le sceglie grano
// per grano. Sul documento diventa {states, curve} — la MultiStateWindowStrategy
// che l'engine gia' conosce — dove `step` da' il cambio netto e `linear` il
// morphing progressivo. Gli altri categoriali restano fissi per lo stream.
const EP = "grain.envelope";
const ENVP = L.params.find(p => p.path === EP && p.kind !== "num") || null;
const CAT = L.params.filter(p => p.kind !== "num" && p.path !== EP);
// I parametri che stanno sui breakpoint: i numerici piu' l'envelope.
const AUT = NUM.concat(ENVP ? [ENVP] : []);

// Da dove parte il laboratorio. Non sono i valori di `base:` — quello e' lo
// stream a riposo dello *sweep*, tarato per i render della griglia (volume 12
// compensa un sample crudo, speed_ratio 0.1 accompagna il passo dello sweep).
// Qui serve un punto di partenza neutro per l'ascolto: grana media, niente
// dispersione, niente trasposizione. Un parametro che non e' in questa tabella
// parte da `base:`, e se manca anche li' dalla sua prima tacca.
// La durata dello stream composto qui: un default solo, in un posto solo.
const DUR = 30;

const DEFAULTS = {
  "grain.duration": 0.064,
  "grain.duration_range": 0,
  "grain.envelope": "gaussian",
  "fill_factor": 2,
  "pitch.ratio": 1,
  "pitch.range": 0,
  "pointer.speed_ratio": 1,
  "pointer.offset_range": 0,
  "distribution": 0,
  "volume": 0,
};

function iniziale(p) {
  const d = DEFAULTS[p.path];
  if (d !== undefined) return d;
  const b = leggiPath(L.base, p.path);
  if (b !== undefined && b !== null) return b;
  return p.values.length ? p.values[0] : (p.free ? 0 : "");
}

let bps = [];        // [{t, vals:{path: numero}}] — sempre ordinati per t
// Il loop del pointer: [inizio, fine] come frazioni del sample, o null.
// Frazioni e non secondi perche' la forma d'onda da' proprio quelle, e
// riaprendo non serve conoscere la durata del file.
let LOOP = null;

// Il loop scritto in uno stream. Solo `loop_unit: normalized`: un loop in
// secondi non si sa disegnare senza la durata del sample.
// ponytail: loop in secondi ignorato in lettura (e riscritto via in labDoc);
// convertirlo quando la durata del sample e' nota, se servira'.
function loopDi(st) {
  const p = (st && st.pointer) || {};
  if (p.loop_start == null || p.loop_unit !== "normalized") return null;
  const fine = p.loop_end != null ? p.loop_end
             : p.loop_dur != null ? p.loop_start + p.loop_dur : 1;
  return [Number(p.loop_start), Math.min(1, Number(fine))];
}

// L'inverso, sul documento. Senza loop le chiavi spariscono: il pointer
// percorre il file intero. Con il loop sparisce `start`, cosi' il pointer
// parte da loop_start invece di arrivarci (l'engine fa cosi' quando start
// manca).
function scriviLoop(st, loop) {
  const p = st.pointer = st.pointer || {};
  for (const k of ["loop_start", "loop_end", "loop_dur", "loop_unit"]) delete p[k];
  if (!loop) return;
  delete p.start;
  const r = v => Math.round(v * 1e4) / 1e4;
  Object.assign(p, {loop_unit: "normalized", loop_start: r(loop[0]), loop_end: r(loop[1])});
}
let curBp = -1;

function labInit() {
  if (!L.params.length) {
    document.getElementById("lab").innerHTML =
      "<p>lo study.yml non dichiara parametri con <code>values</code>.</p>";
    return;
  }
  const mk = (p, box) => {
    const r = document.createElement("div"); r.className = "row";
    const k = document.createElement("div"); k.className = "k"; k.textContent = p.path;
    // `free`: un parametro senza tacche, che si scrive invece di sceglierlo —
    // il volume e' un aggiustamento continuo, non una scala da esplorare. Il
    // resto del laboratorio non se ne accorge: legge `P:<path>`.value come
    // per un menu, e i breakpoint funzionano identici.
    // Un numerico si sceglie fra le tacche ma si scrive anche a mano: e' un
    // `input` con la `datalist` delle tacche, non un menu chiuso. Il resto del
    // laboratorio non se ne accorge: legge `P:<path>`.value come prima.
    // `free` (il volume) e' lo stesso campo senza tacche.
    const libero = p.free || p.kind === "num";
    const s = document.createElement(libero ? "input" : "select");
    s.id = "P:" + p.path;
    if (libero) {
      // type=text e non number: in Safari la datalist su un number non si
      // apre. Il valore lo converte gia' `Number(...)` a valle.
      s.type = "text";
      s.inputMode = "decimal";
      // I limiti dell'engine non bloccano piu' il campo (type=text): restano
      // come suggerimento sul passaggio del mouse.
      if (p.min != null || p.max != null) s.title = p.min + " .. " + p.max;
      if (p.values.length) {
        const dl = document.createElement("datalist");
        dl.id = "D:" + p.path;
        for (const v of p.values) {
          const o = document.createElement("option");
          o.value = v; o.label = fmt(v);
          dl.appendChild(o);
        }
        s.setAttribute("list", dl.id);
        r.appendChild(dl);
      }
      s.value = iniziale(p);
    } else {
      for (const v of p.values) {
        const o = document.createElement("option");
        o.value = v; o.textContent = fmt(v);
        s.appendChild(o);
      }
      s.value = iniziale(p);
      // Un default che non e' fra le tacche lascerebbe il menu vuoto: li'
      // vale la prima, che e' cio' che il menu faceva da solo.
      if (!s.value && p.values.length) s.value = p.values[0];
    }
    r.appendChild(k); r.appendChild(s); box.appendChild(r);
  };
  const fixed = document.getElementById("labFixed");
  // `grain.envelope`: tutte le finestre dell'engine, non solo quelle rimaste
  // nello study.yml — non e' un asse, e' una scelta per stream — e ognuna col
  // suo profilo disegnato, che e' l'unica cosa che le distingue davvero.
  const ENV = L.envelopes || {};
  fixed.innerHTML = "<h2>fissi per lo stream</h2>";
  for (const p of CAT) mk(p, fixed);
  ascoltoSample(fixed);
  for (const [id, lab, val, type] of [["labDur", "durata (s)", DUR, "number"],
                                      ["labName", "nome", "lab", "text"]]) {
    const r = document.createElement("div"); r.className = "row";
    const k = document.createElement("div"); k.className = "k"; k.textContent = lab;
    const i = document.createElement("input");
    i.id = id; i.type = type; i.value = val;
    r.appendChild(k); r.appendChild(i); fixed.appendChild(r);
  }
  const box = document.getElementById("labParams");
  // Tre livelli, dal piu' largo al piu' stretto: tutti i breakpoint -> questo
  // breakpoint -> il singolo parametro. Si decide in blocco e poi si fanno le
  // eccezioni, che e' l'ordine in cui si lavora davvero.
  const ovunque = mkInterp("**");
  ovunque.onchange = () => {
    // Questo scrive subito su TUTTI i punti: non e' una proposta da salvare,
    // e' la decisione che azzera le eccezioni fatte finora.
    for (const b of bps) {
      b.ints = b.ints || {};
      for (const p of AUT) b.ints[p.path] = ovunque.value;
    }
    for (const p of AUT) document.getElementById("I:" + p.path).value = ovunque.value;
    drawTl();
    document.getElementById("labInfo").textContent =
      "interpolazione " + ovunque.value + " su tutti i " + bps.length + " breakpoint";
  };
  box.appendChild(riga("interpolazione (tutti)", ovunque, "capo capo2"));

  const tutti = mkInterp("*");
  tutti.onchange = () => {
    for (const p of AUT) document.getElementById("I:" + p.path).value = tutti.value;
    labInfo();
  };
  box.appendChild(riga("interpolazione (questo bp)", tutti, "capo"));
  for (const p of NUM) { mk(p, box); box.lastChild.appendChild(mkInterp(p.path)); }
  if (ENVP) {
    if (Object.keys(ENV).length) mkEnv(ENVP, box, ENV); else mk(ENVP, box);
    box.lastChild.appendChild(mkInterp(EP));
  }
  document.getElementById("bpAdd").onclick = bpAdd;
  document.getElementById("bpSave").onclick = bpSave;
  document.getElementById("bpAll").onclick = bpAll;
  document.getElementById("bpDel").onclick = bpDel;
  // Cambiare un select su un breakpoint selezionato non lo modifica da solo:
  // finche' non si salva, i valori a schermo e quelli del punto divergono, e
  // e' l'unica cosa che si puo' guardare senza accorgersene. Lo dice l'info.
  for (const p of NUM) document.getElementById("P:" + p.path).onchange = labInfo;
  if (ENVP) ENVCB = labInfo;
  document.getElementById("labRender").onclick = labRender;
  document.getElementById("fNew").onclick = fNew;
  document.getElementById("fOpen").onclick = fOpen;
  document.getElementById("fSave").onclick = () => fSave(false);
  document.getElementById("fSaveAs").onclick = () => fSave(true);
  ripristina();
  segna();
}

// Il sample si sente PRIMA di sceglierlo, come nel browser dei media di
// PGE-ui — ma senza popup: il pannello di destra e' gia' un lettore completo
// (sonogramma, forma d'onda, spectroscope, stereoscope, cursore che si
// trascina, durata e frequenza di campionamento nella riga di stato). Un
// secondo lettore dentro una finestra sarebbe lo stesso codice due volte, in
// meno spazio.
function ascoltoSample(fixed) {
  const sel = document.getElementById("P:sample");
  if (!sel) return;
  sel.parentNode.classList.add("audio");
  const b = document.createElement("button");
  b.textContent = "▶ ascolta";
  b.title = "sente il sample nel pannello di destra (spazio: play/pausa)";
  b.onclick = () => ascolta(sel.value);
  sel.parentNode.appendChild(b);
  // Il ritorno: l'ultimo render dello stream e' ancora sul disco e i suoi
  // campioni sono ancora nella cache dell'analisi, quindi tornarci e'
  // immediato e non rende niente. Senza questo, per riascoltare lo stream
  // dopo un sample bisognerebbe ri-renderizzarlo.
  TORNA = document.createElement("button");
  TORNA.textContent = "↩ stream";
  TORNA.title = "torna all'ultimo render dello stream";
  TORNA.disabled = true;
  TORNA.onclick = () => riprendiStream();
  sel.parentNode.appendChild(TORNA);
  // Cambiare sample lo fa partire: scegliere un materiale E' ascoltarlo, e
  // un click in meno per ogni file conta quando se ne provano trenta.
  sel.onchange = () => { ascolta(sel.value); bozzaSalva(); segna(); };
}

// L'ultimo render del laboratorio, per poterci tornare dopo aver ascoltato
// un sample. Il bottone e' spento finche' non c'e' niente dove tornare.
let ULTIMO = "";
let TORNA = null;

function riprendiStream() {
  if (!ULTIMO) return;
  document.getElementById("now").innerHTML =
    "<b>stream</b><br><span class='file'>" +
    (document.getElementById("labName").value || "lab") + "</span>";
  LAB_AUDIO = true;
  SAMPLE_AUDIO = false;
  audio.src = ULTIMO;
  audio.play();
  analyse(ULTIMO);
  marcaAudio();
}

// `/samples/` non sta sotto lo studio: e' il server che lo mappa sulla
// cartella dei sample del repo (serve.translate_path).
async function ascolta(nome) {
  if (!nome) return;
  const url = "/samples/" + nome.split("/").map(encodeURIComponent).join("/");
  // Il caso vero: un `make serve` avviato prima che questa rotta esistesse.
  // Senza questo controllo l'audio non parte e non lo dice nessuno — e' lo
  // stesso silenzio che `post` evita sulle rotte POST.
  const r = await fetch(url, {method: "HEAD"}).catch(() => null);
  if (!r || !r.ok) {
    document.getElementById("labInfo").textContent = r && r.status === 404
      ? "il server non serve /samples/: e' una versione vecchia (o un altro "
        + "studio), fermalo con Ctrl-C e rilancia `make serve`."
      : "sample non raggiungibile: serve `make serve` (non file://).";
    return;
  }
  LAB_AUDIO = false;
  SAMPLE_AUDIO = true;
  marcaAudio();
  document.getElementById("now").innerHTML =
    "<b>sample</b><br><span class='file'>" + nome + "</span>";
  audio.src = url;
  audio.play();
  analyse(url);
}

// Una finestra disegnata: polilinea del profilo vero, quello che l'engine
// moltiplica per il grano.
function envSvg(pts) {
  const w = 46, h = 20;
  const d = pts.map((v, i) =>
    (i ? "L" : "M") + (i / (pts.length - 1) * w).toFixed(1) + " " +
    ((1 - v) * (h - 2) + 1).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${d}"/></svg>`;
}

let ENVCB = null;    // labInit lo aggancia a labInfo, come per i select

function mkEnv(p, box, ENV) {
  const r = document.createElement("div"); r.className = "row";
  const k = document.createElement("div"); k.className = "k"; k.textContent = p.path;
  // Il valore vive in un campo nascosto: labDoc legge "P:<path>" come per
  // ogni altro parametro, e la galleria e' solo il modo di sceglierlo.
  const hid = document.createElement("input");
  hid.type = "hidden"; hid.id = "P:" + p.path;
  const d = iniziale(p);
  hid.value = ENV[d] ? d : (p.values.includes("hanning") ? "hanning" : Object.keys(ENV)[0]);
  const box2 = document.createElement("div"); box2.id = "envs";
  for (const [name, pts] of Object.entries(ENV)) {
    const b = document.createElement("button");
    b.innerHTML = envSvg(pts) + "<span class='n'>" + name + "</span>";
    b.title = name;
    if (name === hid.value) b.classList.add("on");
    b.onclick = () => {
      hid.value = name;
      for (const o of box2.querySelectorAll("button")) o.classList.toggle("on", o === b);
      if (ENVCB) ENVCB();
    };
    box2.appendChild(b);
  }
  r.appendChild(k); r.appendChild(box2); r.appendChild(hid);
  box.appendChild(r);
}

// Una riga della griglia dei parametri: etichetta a sinistra, il menu nella
// terza colonna (la seconda, quella del valore, qui resta vuota).
function riga(testo, el, cls) {
  const r = document.createElement("div");
  r.className = "row " + cls;
  r.innerHTML = "<div class='k'>" + testo + "</div><div></div>";
  r.appendChild(el);
  return r;
}

function mkInterp(path) {
  const s = document.createElement("select");
  s.id = "I:" + path;
  for (const t of INTERP) {
    const o = document.createElement("option");
    o.value = o.textContent = t;
    s.appendChild(o);
  }
  s.value = "linear";
  if (path !== "*") s.onchange = labInfo;
  return s;
}

function snapshot() {
  const v = {};
  for (const p of AUT) {
    const raw = document.getElementById("P:" + p.path).value;
    // Scritto a mano: la virgola vale il punto, e un campo vuoto o sbagliato
    // tiene il valore del breakpoint invece di diventare NaN.
    const testo = String(raw).trim().replace(",", ".");
    v[p.path] = p.kind === "num" ? (testo === "" ? NaN : Number(testo)) : raw;
    if (p.kind === "num" && !Number.isFinite(v[p.path]))
      v[p.path] = (bps[curBp] && bps[curBp].vals[p.path]) ?? iniziale(p);
  }
  return v;
}

// Il tipo di interpolazione scelto ora, parametro per parametro.
function snapInterp() {
  const v = {};
  for (const p of AUT) v[p.path] = document.getElementById("I:" + p.path).value;
  return v;
}

// Il tipo di un parametro in un breakpoint. I punti salvati prima che i tipi
// esistessero non ce l'hanno: valgono linear, che e' cio' che facevano.
function tipoDi(b, path) { return (b.ints || {})[path] || "linear"; }

function bpAdd() {
  // Il primo breakpoint sta a 0, gli altri in fondo: da li' si trascinano.
  const t = bps.length ? 1 : 0;
  bps.push({t, vals: snapshot(), ints: snapInterp()});
  bps.sort((a, b) => a.t - b.t);
  curBp = bps.findIndex(b => b.t === t);
  drawTl();
}

function bpSave() {
  if (curBp < 0) return;
  bps[curBp].vals = snapshot();
  bps[curBp].ints = snapInterp();
  drawTl();
}

// I parametri che i select mostrano diversi dal breakpoint selezionato: sono
// quelli che hai appena cambiato, e l'unica cosa che `applica a tutti` deve
// toccare.
function cambiati() {
  if (curBp < 0) return [];
  const ora = snapshot(), ori = snapInterp();
  return AUT.map(p => p.path).filter(
    k => ora[k] !== bps[curBp].vals[k] || ori[k] !== tipoDi(bps[curBp], k));
}

// Scrive SOLO quei parametri su ogni breakpoint. Gli altri restano come
// sono, ognuno col suo valore: un inviluppo che avevi disegnato non va
// appiattito perche' stavi cambiando un'altra manopola.
function bpAll() {
  const ks = cambiati();
  if (!ks.length) return;
  const ora = snapshot(), ori = snapInterp();
  for (const b of bps) for (const k of ks) {
    b.vals[k] = ora[k];
    (b.ints = b.ints || {})[k] = ori[k];
  }
  drawTl();
  document.getElementById("labInfo").textContent =
    "applicato a tutti i " + bps.length + " breakpoint: " + ks.join(", ");
}

function bpDel() {
  if (curBp < 0) return;
  bps.splice(curBp, 1);
  curBp = Math.min(curBp, bps.length - 1);
  drawTl();
}

function bpLoad(i) {
  curBp = i;
  // setSel e non `s.value =`: la galleria delle finestre ha anche il bottone
  // acceso da spostare, e il valore da solo lascerebbe indietro il disegno.
  for (const [path, v] of Object.entries(bps[i].vals)) setSel(path, v);
  for (const p of AUT) {
    const s = document.getElementById("I:" + p.path);
    if (s) s.value = tipoDi(bps[i], p.path);
  }
  drawTl();
}

function drawTl() {
  bozzaSalva();
  if (typeof segna === "function") segna();
  marcaAudio();
  const tl = document.getElementById("tl");
  tl.innerHTML = "";
  bps.forEach((b, i) => {
    const d = document.createElement("div");
    d.className = "bp" + (i === curBp ? " on" : "");
    d.style.left = (b.t * 100) + "%";
    d.innerHTML = "<span class='t'>" + b.t.toFixed(2) + "</span>";
    d.onpointerdown = e => {
      e.preventDefault();
      bpLoad(i);
      const box = tl.getBoundingClientRect();
      const move = ev => {
        b.t = Math.min(1, Math.max(0, (ev.clientX - box.left) / box.width));
        drawTl();
      };
      const up = () => {
        removeEventListener("pointermove", move);
        removeEventListener("pointerup", up);
        // L'ordine dei punti e' il tempo: dopo il trascinamento la lista va
        // riordinata, o `serie` produrrebbe un inviluppo che torna indietro.
        const b0 = bps[curBp];
        bps.sort((x, y) => x.t - y.t);
        curBp = bps.indexOf(b0);
        drawTl();
      };
      addEventListener("pointermove", move);
      addEventListener("pointerup", up);
    };
    tl.appendChild(d);
  });
  labInfo();
}

// Un parametro diventa una lista di breakpoint solo dove cambia: i punti in
// cui il valore e' uguale sia a prima che a dopo non dicono niente che
// l'interpolazione non dica gia', e un inviluppo con dodici punti identici
// e' illeggibile. Se non cambia mai, resta lo scalare che era.
//
// Il tipo va sul punto da cui parte il segmento, e solo se non e' `linear`
// (che e' il default dell'engine): scriverlo ovunque raddoppierebbe la
// lunghezza di ogni riga per dire quello che gia' si sa. Un punto che cambia
// il tipo non e' ridondante nemmeno a valore fermo — decide come si arriva
// al prossimo — quindi resta.
function serie(path) {
  const pts = bps.map(b => [b.t, b.vals[path], tipoDi(b, path)]);
  if (!pts.length || pts.some(p => !Number.isFinite(p[1]))) return null;
  if (pts.every(p => p[1] === pts[0][1]) && pts.every(p => p[2] === "linear"))
    return pts[0][1];
  const tenuti = pts.filter((p, i) =>
    i === 0 || i === pts.length - 1 ||
    !(pts[i - 1][1] === p[1] && pts[i + 1][1] === p[1]) ||
    p[2] !== pts[i - 1][2]);
  return tenuti.map((p, i) =>
    // L'ultimo punto non ha un segmento dopo di se': niente tipo.
    (p[2] === "linear" || i === tenuti.length - 1) ? [p[0], p[1]] : [p[0], p[1], p[2]]);
}

// La sequenza delle finestre diventa {states, curve}: gli stati sono le
// finestre nell'ordine in cui compaiono — una ripetizione consecutiva non ne
// apre uno nuovo — spaziati uniformemente in [0,1], e la curve e' il cammino
// nel tempo dentro quello spazio. Cosi' gli stati restano crescenti come
// l'engine pretende anche quando la sequenza torna su una finestra gia' usata:
// hanning -> bartlett -> hanning da' tre stati, non due.
//
// Se la finestra non cambia mai resta la stringa di prima: uno stream con un
// envelope solo non ha motivo di diventare un multistate.
function serieEnv() {
  const seq = bps.map(b => b.vals[EP]);
  if (!seq.length || seq.some(w => !w)) return null;
  if (seq.every(w => w === seq[0])) return seq[0];
  const W = [], idx = [];
  for (const w of seq) {
    if (!W.length || W[W.length - 1] !== w) W.push(w);
    idx.push(W.length - 1);
  }
  const n = W.length - 1;
  return {
    states: W.map((w, i) => [i / n, w]),
    // Il tipo sta sul punto e governa il segmento che parte di li'; l'ultimo
    // non ne ha uno, e `linear` e' il default che non si scrive.
    curve: bps.map((b, i) => {
      const pt = [b.t, idx[i] / n], tipo = tipoDi(b, EP);
      return (tipo === "linear" || i === bps.length - 1) ? pt : pt.concat(tipo);
    }),
  };
}

// L'inverso: la finestra al tempo t. La curve vale li' quanto dice il suo
// inviluppo e lo stato e' quello col valore piu' vicino — sui tempi dei
// breakpoint ci cade esattamente sopra, che e' cio' che chiude il round-trip.
function envA(spec, t) {
  if (typeof spec === "string") return spec;
  if (!spec || !spec.states || !spec.states.length) return null;
  const v = Number(valoreA(spec.curve, t));
  let best = spec.states[0];
  for (const st of spec.states)
    if (Math.abs(st[0] - v) < Math.abs(best[0] - v)) best = st;
  return best[1];
}

function labDoc() {
  const dur = Number(document.getElementById("labDur").value) || DUR;
  // stream_id/onset/duration in testa, come nei documenti scritti a mano.
  const st = Object.assign({stream_id: "lab", onset: 0, duration: dur},
                           JSON.parse(JSON.stringify(L.base)));
  st.onset = 0;
  st.duration = dur;
  for (const p of CAT) setPath(st, p.path, document.getElementById("P:" + p.path).value);
  for (const p of NUM) {
    const v = serie(p.path);
    if (v !== null) setPath(st, p.path, v);
  }
  if (ENVP) {
    const v = serieEnv();
    if (v !== null) setPath(st, EP, v);
  }
  scriviLoop(st, LOOP);
  return {duration: dur, bpm: 120, streams: [st]};
}

function setPath(obj, path, v) {
  const parts = path.split(".");
  let o = obj;
  for (const k of parts.slice(0, -1)) o = (o[k] = o[k] || {});
  o[parts[parts.length - 1]] = v;
}

function labInfo() {
  const mossi = NUM.filter(p => Array.isArray(serie(p.path)));
  if (ENVP && typeof serieEnv() === "object" && serieEnv() !== null)
    mossi.push(ENVP);
  // Quali select non corrispondono piu' al breakpoint selezionato.
  const diversi = cambiati();
  document.getElementById("bpSave").disabled = !diversi.length;
  document.getElementById("bpAll").disabled = !diversi.length;
  document.getElementById("labInfo").textContent =
    bps.length + " breakpoint · " + mossi.length + " parametri mossi" +
    (mossi.length ? ": " + mossi.map(p => p.path).join(", ") : "") +
    (diversi.length ? "  |  non salvati sul breakpoint " + (curBp + 1) + ": "
                      + diversi.join(", ") : "");
  document.getElementById("labYaml").textContent = bps.length ? preview() : "";
}

// I breakpoint disegnati sopra sonogramma e forma d'onda: trascinando un
// punto si vede dove cade nel suono, non solo su una linea astratta.
//
// Ha senso solo se quello che suona e' il render di QUESTI breakpoint: su un
// file della griglia le stesse righe indicherebbero punti a caso. Lo dice
// LAB_AUDIO (dichiarato in cima, dove `go` lo vede), che la griglia spegne e
// il render del laboratorio accende.
function marcaAudio() {
  lpSync();
  const wv = document.getElementById("waveView");
  for (const v of wv.querySelectorAll(".loopr")) v.remove();
  if (SAMPLE_AUDIO && LOOP) {
    const r = document.createElement("div");
    r.className = "loopr";
    r.style.left = (LOOP[0] * 100) + "%";
    r.style.width = ((LOOP[1] - LOOP[0]) * 100) + "%";
    [0, 1].forEach(k => {
      const h = document.createElement("b");
      h.className = k ? "b" : "a";
      h.onpointerdown = e => {
        e.preventDefault();          // niente mousedown: non e' un seek
        const box = wv.getBoundingClientRect();
        const move = ev => {
          const x = Math.min(1, Math.max(0, (ev.clientX - box.left) / box.width));
          // Un estremo non scavalca l'altro: loop_end > loop_start, lo
          // pretende l'engine.
          LOOP[k] = k ? Math.max(LOOP[0] + 0.001, x) : Math.min(LOOP[1] - 0.001, x);
          drawTl();
        };
        const up = () => {
          removeEventListener("pointermove", move);
          removeEventListener("pointerup", up);
        };
        addEventListener("pointermove", move);
        addEventListener("pointerup", up);
      };
      r.appendChild(h);
    });
    wv.appendChild(r);
  }
  for (const id of ["specView", "waveView"]) {
    const box = document.getElementById(id);
    if (!box) continue;
    for (const v of box.querySelectorAll(".bpm")) v.remove();
    if (!LAB_AUDIO) continue;
    bps.forEach((b, i) => {
      const m = document.createElement("div");
      m.className = "bpm" + (i === curBp ? " on" : "");
      m.style.left = (b.t * 100) + "%";
      if (id === "specView") m.innerHTML = "<i>" + (i + 1) + "</i>";
      box.appendChild(m);
    });
  }
}

// Anteprima: solo i parametri mossi, nella forma che finisce nello YAML —
// terzo elemento compreso, altrimenti due inviluppi che suonano diverso si
// leggono identici e la scelta dell'interpolazione sembra non aver fatto
// niente.
function preview() {
  const punto = pt => "[" + pt[0].toFixed(3) + ", " + pt[1] +
                      (pt[2] ? ", " + pt[2] : "") + "]";
  const righe = NUM.map(p => [p.path, serie(p.path)])
                   .filter(([, v]) => Array.isArray(v))
                   .map(([k, v]) => k + ": [" + v.map(punto).join(", ") + "]");
  const e = ENVP ? serieEnv() : null;
  if (e && typeof e === "object")
    righe.push(EP + ":\n  states: [" +
               e.states.map(st => "[" + st[0].toFixed(3) + ", " + st[1] + "]").join(", ") +
               "]\n  curve: [" + e.curve.map(punto).join(", ") + "]");
  if (LOOP) righe.push("pointer.loop (normalized): [" + LOOP.map(v => v.toFixed(4)).join(", ") + "]");
  return righe.join("\n");
}


// --- il file su cui si lavora ---------------------------------------------
// Semantica normale: nuovo / apri / salva / salva con nome, e l'avviso se ci
// sono modifiche non salvate. I pannelli sono quelli di macOS, aperti dal
// server (POST /pick): la pagina da sola non sa dove sta un file sul disco.

// qui, si incolla nel brano o si apre in PGE-ui. I breakpoint non si salvano
// a parte perche' non sono un'informazione in piu': sono i tempi che
// compaiono negli inviluppi.

let FILE = "";        // path assoluto del file aperto; "" = mai salvato
let SALVATO = "";     // com'era il documento all'ultimo salvataggio

function statoOra() { return JSON.stringify(bps.length ? labDoc() : null); }
function sporco() { return statoOra() !== SALVATO; }

function ripristina() {

// Il valore di un parametro fisso: select o galleria delle finestre.

async function post(rotta, body) {
  const info = document.getElementById("labInfo");
  let r;
  try {
    r = await fetch(rotta, {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  } catch (e) {
    info.textContent = "server non raggiungibile: serve `make serve` (non file://).";
    return {ok: false, error: info.textContent};
  }
  if (!r.ok) {
    // Il caso vero: un `make serve` avviato prima che questa rotta esistesse.
    // Senza questo messaggio il bottone semplicemente non reagisce.
    info.textContent = r.status === 404
      ? "il server non conosce /" + rotta + ": e' una versione vecchia, "
        + "fermalo (Ctrl-C) e rilancia `make serve`."
      : "il server ha risposto " + r.status + ".";
    return {ok: false, error: info.textContent};
  }
  try {
    return await r.json();
  } catch (e) {
    info.textContent = "risposta non leggibile dal server: " + e;
    return {ok: false, error: info.textContent};
  }
}

                 + ".\nVuoi " + cosa + " comunque? (Annulla per tornare indietro e salvare)");

  if (sc.error) { info.textContent = sc.error; return; }

function dir(p) { return p.slice(0, p.lastIndexOf("/")); }

async function fSave(chiediDove) {

  let path = FILE;

    const sc = await post("pick", {mode: "save", name: nome, start: FILE ? dir(FILE) : ""});
    if (sc.error) { document.getElementById("labInfo").textContent = sc.error; return; }
    if (!sc.path) return;
    path = sc.path;
  }

// Carica un documento nel laboratorio: i breakpoint sono i tempi che
// compaiono negli inviluppi, e ogni parametro vale li' quanto vale il suo.
function carica(doc, path) {
  if (!doc || !doc.streams || !doc.streams[0]) {
    document.getElementById("labInfo").textContent = "non e' un documento con stream.";
    return;
  }
  const st = doc.streams[0];
  const ts = new Set([0]);
  for (const p of NUM) {
    const v = leggiPath(st, p.path);
    if (Array.isArray(v)) for (const [t] of v) ts.add(t);
  }
  // I tempi della curve dell'envelope sono breakpoint come gli altri: e' la
  // stessa unione, altrimenti riaprendo un cambio di finestra sparirebbe.
  const espec = ENVP ? leggiPath(st, EP) : null;
  if (espec && Array.isArray(espec.curve)) for (const [t] of espec.curve) ts.add(t);
  const envOra = () => ENVP ? document.getElementById("P:" + EP).value : null;
  bps = [...ts].sort((a, b) => a - b).map(t => ({
    t,
    // Il tipo del segmento in cui t cade: e' quello che decide come si arriva
    // al punto dopo, ed e' cio' che il menu di quella riga deve mostrare.
    ints: Object.fromEntries(AUT.map(p => [p.path,
      p.path === EP ? tipoA(espec && espec.curve, t)
                    : tipoA(leggiPath(st, p.path), t)])),
    vals: Object.fromEntries(AUT.map(p => {
      if (p.path === EP) return [EP, (espec ? envA(espec, t) : null) || envOra()];
      // Il documento puo' non avere affatto la chiave (un parametro lasciato
      // al default dell'engine): li' vale quello che dice il select, non NaN.
      const v = leggiPath(st, p.path);
      return [p.path, v === undefined || v === null
        ? Number(document.getElementById("P:" + p.path).value)
        : Number(valoreA(v, t))];
    })),
  }));
  for (const p of CAT) setSel(p.path, leggiPath(st, p.path));
  LOOP = loopDi(st);
  FILE = path || "";
  document.getElementById("labName").value =
    (path || "lab").split("/").pop().replace(/\.ya?ml$/, "");
  document.getElementById("labDur").value = doc.duration || st.duration || DUR;
  bpLoad(0);
  SALVATO = statoOra();
  segna();
  document.getElementById("labInfo").textContent =
    (path || "documento") + " — " + bps.length + " breakpoint";
}

// Il valore di un parametro al tempo t: il punto se c'e', altrimenti quello
// che l'inviluppo vale li' — INTERPOLATO, non il piu' vicino a sinistra.
// Riaprendo, un parametro prende un punto a ogni tempo della griglia: col
// valore a sinistra una rampa 0.2 -> 0.75 diventerebbe un plateau a 0.2 e poi
// una rampa piu' ripida, e il file risalvato suonerebbe diverso da quello
// aperto. Un gradino dichiarato (terzo elemento `step`) invece tiene.
function valoreA(v, t) {
  if (!Array.isArray(v)) return v;
  let prev = v[0];
  for (const pt of v) {
    if (pt[0] >= t - 1e-9) {
      if (pt[0] - prev[0] < 1e-9 || prev[2] === "step") return prev[1];
      const k = (t - prev[0]) / (pt[0] - prev[0]);
      return prev[1] + (pt[1] - prev[1]) * k;
    }
    prev = pt;
  }
  return prev[1];
}

// Il tipo del segmento che contiene t (l'ultimo punto non ne ha: vale linear).
function tipoA(v, t) {
  if (!Array.isArray(v)) return "linear";
  let tipo = "linear";
  for (const pt of v) {
    if (pt[0] > t + 1e-9) break;
    tipo = pt[2] || "linear";
  }
  return tipo;
}

function leggiPath(st, path) {
  let o = st;
  for (const k of path.split(".")) { if (o == null) return undefined; o = o[k]; }
  return o;
}

function labRender() { return labPost(true); }

async function labPost(render, path) {
  if (!bps.length) { document.getElementById("labInfo").textContent = "nessun breakpoint."; return; }
  const name = document.getElementById("labName").value || "lab";
  const info = document.getElementById("labInfo");
  info.textContent = render ? "render in corso…" : "salvo…";
  try {
    const out = await post("render", {name, doc: labDoc(), render, path: path || FILE});
    if (!out.ok) { info.textContent = out.error; return; }
    FILE = out.path || FILE;
    SALVATO = statoOra();
    segna();
    info.textContent = out.yaml + (render ? "" : "  (salvato)");
    if (!render) return;
    // `?t=` perche' rirendendo con lo stesso nome il browser servirebbe il
    // file vecchio dalla cache.
    const src = out.src + "?t=" + Date.now();
    ULTIMO = src;
    if (TORNA) TORNA.disabled = false;
    LAB_AUDIO = true;
    SAMPLE_AUDIO = false;
    audio.src = src;
    audio.play();
    analyse(src);
    marcaAudio();
  } catch (e) {
    info.textContent = "server non raggiungibile: serve `make serve` (non file://). " + e;
  }
}

for (const [id, on] of [["tabGrid", false], ["tabLab", true]]) {
  document.getElementById(id).onclick = () => {
    document.getElementById("lab").hidden = !on;
    document.getElementById("griglia").hidden = on;
    document.getElementById("tabGrid").classList.toggle("on", !on);
    document.getElementById("tabLab").classList.toggle("on", on);
  };
}
LOOP = loopDi(L.base);
labInit();
if (!D.combos.length) document.getElementById("tabLab").click();

// ===========================================================================
// Analisi. Due strade diverse, per due domande diverse:
//
//   - sonogramma e forma d'onda guardano il file INTERO, quindi si calcolano
//     una volta sola sui campioni decodificati (fetch + decodeAudioData) e si
//     disegnano su canvas fermi;
//   - spectroscope e stereoscope guardano l'ISTANTE, quindi si leggono dal
//     grafo Web Audio in riproduzione (AnalyserNode) a ogni frame.
//
// Il cursore non e' uno stato: e' una funzione di `audio.currentTime`, letta
// dallo stesso requestAnimationFrame per entrambe le viste. Il seek scrive su
// `audio.currentTime` e basta. Non esistendo una seconda copia della
// posizione, non esiste desincronizzazione possibile.
// ===========================================================================

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = ctx.createAnalyser();
analyser.fftSize = 4096;
analyser.smoothingTimeConstant = 0.6;
const splitter = ctx.createChannelSplitter(2);
const anL = ctx.createAnalyser(), anR = ctx.createAnalyser();
anL.fftSize = anR.fftSize = 2048;
const src = ctx.createMediaElementSource(audio);
// Il gain muta l'elemento quando a suonare e' il loop del sample (vedi LP).
const gainEl = ctx.createGain();
src.connect(gainEl);
gainEl.connect(analyser);
analyser.connect(ctx.destination);
gainEl.connect(splitter);
splitter.connect(anL, 0);
splitter.connect(anR, 1);

audio.addEventListener("play", () => { ctx.resume(); lpSync(); });
audio.addEventListener("pause", () => lpStop());

// --- il loop del sample ----------------------------------------------------
// Un loop non si fa spostando `audio.currentTime` alla fine della regione: il
// seek dell'elemento e' asincrono, il cursore salta subito e il suono riparte
// quando il browser ha ribufferizzato — si sentono i due andare fuori passo.
// Qui suona un AudioBufferSourceNode col loop nativo (preciso al campione) e
// l'elemento resta in play ma muto, solo come trasporto: play/pausa, spazio,
// seek passano ancora da li'. Il cursore legge l'orologio del contesto.
var LP = null;       // {node, ls, le, off, t0}; var: marcaAudio lo tocca prima di qui

function lpPos() {
  const el = Math.max(0, ctx.currentTime - latenza() - LP.t0);
  return LP.ls + (LP.off - LP.ls + el) % (LP.le - LP.ls);
}

function lpStop() {
  if (!LP) return;
  LP.node.stop();
  LP.node.disconnect();
  LP = null;
  gainEl.gain.value = 1;
  audio.loop = loop.checked;
}

function lpStart(at) {
  lpStop();
  const D = view.buf.duration, ls = LOOP[0] * D, le = LOOP[1] * D;
  const off = at >= ls && at < le ? at : ls;
  const node = ctx.createBufferSource();
  node.buffer = view.buf;
  node.loop = true;
  node.loopStart = ls;
  node.loopEnd = le;
  node.connect(analyser);
  node.connect(splitter);
  node.start(0, off);
  LP = {node, ls, le, off, t0: ctx.currentTime};
  gainEl.gain.value = 0;
  audio.loop = true;       // l'elemento muto non deve fermarsi a fine file
}

// Allinea il loop allo stato: parte, si ferma, o riparte se la regione e'
// cambiata (dal punto in cui era).
// ponytail: durante il trascinamento degli estremi riparte a ogni mossa, con
// qualche click; aggiornare loopStart/loopEnd dal vivo se da' fastidio.
function lpSync() {
  if (!LP && !SAMPLE_AUDIO) return;
  const ok = SAMPLE_AUDIO && LOOP && view && view.buf && !audio.paused &&
             audio.src.endsWith(view.url);
  if (!ok) return lpStop();
  const D = view.buf.duration;
  if (LP && LP.ls === LOOP[0] * D && LP.le === LOOP[1] * D) return;
  lpStart(LP ? lpPos() : audio.currentTime);
}

// --- spunte del trasporto, ricordate fra una sessione e l'altra -----------
const hold = document.getElementById("hold"), loop = document.getElementById("loop");
for (const [el, k] of [[hold, "graph.hold"], [loop, "graph.loop"]]) {
  try { el.checked = localStorage.getItem(k) === "1"; } catch (e) {}
  el.addEventListener("change", () => {
    try { localStorage.setItem(k, el.checked ? "1" : "0"); } catch (e) {}
    if (el === loop) audio.loop = loop.checked;
  });
}
audio.loop = loop.checked;

// Il cursore mostra l'istante in cui l'audio e' PRODOTTO; alle orecchie arriva
// dopo (buffer del sistema, DAC, Bluetooth). Il browser lo dice solo a volte
// (`outputLatency`, non in Safari): il resto si tara a orecchio qui.
const latEl = document.getElementById("lat");
try { latEl.value = localStorage.getItem("graph.lat") || 0; } catch (e) { latEl.value = 0; }
latEl.addEventListener("change", () => {
  try { localStorage.setItem("graph.lat", latEl.value); } catch (e) {}
});
function latenza() {
  return (ctx.outputLatency || 0) + (Number(latEl.value) || 0) / 1000;
}

const FMIN = 20;
const cache = new Map();      // src -> {peaks, spec} gia' calcolati

// --- FFT radix-2 iterativa, in-place -------------------------------------
// Cooley-Tukey: bit-reversal in testa, poi log2(N) stadi di farfalle. Le
// tabelle di seno/coseno si calcolano una volta per dimensione: e' l'unica
// parte che vale la pena precalcolare, il resto e' aritmetica.
const twiddles = new Map();
function tables(n) {
  if (twiddles.has(n)) return twiddles.get(n);
  const cos = new Float32Array(n / 2), sin = new Float32Array(n / 2);
  for (let i = 0; i < n / 2; i++) {
    cos[i] = Math.cos(-2 * Math.PI * i / n);
    sin[i] = Math.sin(-2 * Math.PI * i / n);
  }
  const rev = new Uint32Array(n);
  const bits = Math.log2(n);
  for (let i = 0; i < n; i++) {
    let r = 0;
    for (let b = 0; b < bits; b++) if (i & (1 << b)) r |= 1 << (bits - 1 - b);
    rev[i] = r;
  }
  const t = {cos, sin, rev};
  twiddles.set(n, t);
  return t;
}

function fft(re, im) {
  const n = re.length, {cos, sin, rev} = tables(n);
  for (let i = 0; i < n; i++) {
    const j = rev[i];
    if (j > i) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let size = 2; size <= n; size <<= 1) {
    const half = size >> 1, step = n / size;
    for (let i = 0; i < n; i += size) {
      for (let j = 0, k = 0; j < half; j++, k += step) {
        const l = i + j, r = l + half;
        const tr = re[r] * cos[k] - im[r] * sin[k];
        const ti = re[r] * sin[k] + im[r] * cos[k];
        re[r] = re[l] - tr; im[r] = im[l] - ti;
        re[l] += tr;        im[l] += ti;
      }
    }
  }
}

// --- STFT: una colonna di magnitudini in dB per hop ------------------------
const DBFLOOR = -96;

// La finestra decide il compromesso: piu' lunga = piu' risoluzione in
// frequenza e meno nel tempo. Su grani da 20 us conta la seconda, su grani da
// mezzo secondo la prima — per questo la scelta e' esposta e non fissata.
// L'hop resta un quarto della finestra: 75% di sovrapposizione a ogni misura.
function stft(mono, n) {
  const win = new Float32Array(n);              // Hann
  for (let i = 0; i < n; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / n);
  const hop = n / 4;
  const cols = Math.max(1, Math.floor((mono.length - n) / hop) + 1);
  const bins = n / 2;
  const out = new Float32Array(cols * bins);
  const re = new Float32Array(n), im = new Float32Array(n);
  for (let c = 0; c < cols; c++) {
    const off = c * hop;
    for (let i = 0; i < n; i++) {
      re[i] = (mono[off + i] || 0) * win[i];
      im[i] = 0;
    }
    fft(re, im);
    for (let b = 0; b < bins; b++) {
      const m = Math.sqrt(re[b] * re[b] + im[b] * im[b]) * 2 / n;
      out[c * bins + b] = Math.max(DBFLOOR, 20 * Math.log10(m + 1e-12));
    }
  }
  return {cols, bins, db: out};
}

// Picchi min/max per colonna di pixel: la forma d'onda vera, non un
// sottocampionamento che salta le transienti (con grani da 20 us salterebbe
// tutto).
function peaks(mono, cols) {
  const per = mono.length / cols;
  const lo = new Float32Array(cols), hi = new Float32Array(cols);
  for (let c = 0; c < cols; c++) {
    const a = Math.floor(c * per), b = Math.min(mono.length, Math.floor((c + 1) * per));
    let mn = 0, mx = 0;
    for (let i = a; i < b; i++) {
      const v = mono[i];
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    lo[c] = mn; hi[c] = mx;
  }
  return {lo, hi};
}

function mixdown(buf) {
  const n = buf.length, out = new Float32Array(n);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < n; i++) out[i] += d[i];
  }
  if (buf.numberOfChannels > 1) for (let i = 0; i < n; i++) out[i] /= buf.numberOfChannels;
  return out;
}

// Scala di colore: nero -> viola -> arancio -> bianco, in tre tratti lineari.
// Serve solo a rendere leggibili 96 dB di dinamica, non e' percettivamente
// uniforme.
function heat(v) {
  const s = [[0, 0, 0], [60, 20, 90], [220, 90, 30], [255, 255, 220]];
  const t = Math.min(0.999, Math.max(0, v)) * 3;
  const i = Math.floor(t), f = t - i;
  const a = s[i], b = s[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}

let view = null;   // {duration} della clip attualmente disegnata
let logScale = true, nfft = 2048;

const RES = [256, 512, 1024, 2048, 4096, 8192];
function drawCtl() {
  const sc = document.getElementById("scale"), rs = document.getElementById("res");
  sc.innerHTML = ""; rs.innerHTML = "";
  for (const [lab, v] of [["lin", false], ["log", true]]) {
    const b = document.createElement("button");
    b.textContent = lab;
    if (logScale === v) b.classList.add("on");
    b.onclick = () => { logScale = v; drawCtl(); redrawSpec(); };
    sc.appendChild(b);
  }
  for (const n of RES) {
    const b = document.createElement("button");
    b.textContent = n;
    if (nfft === n) b.classList.add("on");
    // Ogni risoluzione ha la sua STFT, tenuta in cache a parte: tornare
    // indietro non ricalcola.
    b.onclick = () => { nfft = n; drawCtl(); redrawSpec(); };
    rs.appendChild(b);
  }
}

function redrawSpec() {
  if (!view) return;
  const c = document.getElementById("spec");
  c.width = c.parentNode.clientWidth;
  drawSpec(c, view);
}

async function analyse(url) {
  const specC = document.getElementById("spec"), waveC = document.getElementById("wave");
  const scopeEl = document.getElementById("scope");
  specC.width = specC.parentNode.clientWidth;
  waveC.width = waveC.parentNode.clientWidth;
  scopeEl.width = scopeEl.parentNode.clientWidth;
  status.textContent = "analisi…";
  let data = cache.get(url);
  if (!data) {
    try {
      const buf = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
      const mono = mixdown(buf);
      data = {duration: buf.duration, rate: buf.sampleRate, mono, buf, url};
      cache.set(url, data);
    } catch (e) {
      status.textContent = "impossibile leggere l'audio (" + e.name +
        "): apri la pagina da http://localhost, non da file://.";
      return;
    }
  }
  view = data;
  lpSync();          // il play e' arrivato prima dell'analisi: il buffer c'e' ora
  drawCtl();
  drawSpec(specC, data);
  drawWave(waveC, data);
  const s = data.specs[nfft];
  status.textContent = data.duration.toFixed(2) + " s · " + data.rate + " Hz · " +
    "finestra " + nfft + " campioni (" + (nfft / data.rate * 1000).toFixed(1) + " ms, " +
    (data.rate / nfft).toFixed(1) + " Hz per bin) · " + s.cols + " colonne";
}

function drawSpec(c, d) {
  const g = c.getContext("2d"), W = c.width, H = c.height;
  d.specs = d.specs || {};
  const s = d.specs[nfft] || (d.specs[nfft] = stft(d.mono, nfft));
  const nyq = d.rate / 2, binHz = nyq / s.bins;
  const img = g.createImageData(W, H);
  for (let x = 0; x < W; x++) {
    const col = Math.min(s.cols - 1, Math.floor(x / W * s.cols));
    for (let y = 0; y < H; y++) {
      // y=0 in alto = Nyquist. In log lo spazio e' distribuito per ottave —
      // le prime armoniche si leggono; in lineare per hertz — l'alto si legge.
      const f = logScale ? FMIN * Math.pow(nyq / FMIN, 1 - y / H)
                         : nyq * (1 - y / H);
      const b = Math.min(s.bins - 1, Math.round(f / binHz));
      const db = s.db[col * s.bins + b];
      const [r, gg, bb] = heat((db - DBFLOOR) / -DBFLOOR);
      const p = (y * W + x) * 4;
      img.data[p] = r; img.data[p + 1] = gg; img.data[p + 2] = bb; img.data[p + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}

function drawWave(c, d) {
  const g = c.getContext("2d"), W = c.width, H = c.height, mid = H / 2;
  const p = peaks(d.mono, W);
  g.clearRect(0, 0, W, H);
  g.strokeStyle = getComputedStyle(document.body).color;
  g.globalAlpha = .8;
  g.beginPath();
  for (let x = 0; x < W; x++) {
    g.moveTo(x + .5, mid - p.hi[x] * mid);
    g.lineTo(x + .5, mid - p.lo[x] * mid);
  }
  g.stroke();
  g.globalAlpha = .25;
  g.beginPath(); g.moveTo(0, mid); g.lineTo(W, mid); g.stroke();
  g.globalAlpha = 1;
}

// --- seek: un solo handler per entrambe le viste --------------------------
function seekFrom(el, e) {
  if (!view) return;
  const r = el.getBoundingClientRect();
  vaiA(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * view.duration);
}

function vaiA(t) {
  audio.currentTime = t;
  if (LP) lpStart(t);
}
// Sulla forma d'onda di un sample un trascinamento non e' un seek ma un
// loop: click = seek, click e trascina = regione. Sotto i 4 pixel e' un
// click con la mano che trema.
for (const id of ["specView", "waveView"]) {
  const el = document.getElementById(id);
  let down = false, x0 = 0, disegna = false;
  const frac = e => {
    const r = el.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  el.addEventListener("mousedown", e => {
    down = true; disegna = false; x0 = e.clientX; seekFrom(el, e);
  });
  addEventListener("mousemove", e => {
    if (!down) return;
    if (id === "waveView" && SAMPLE_AUDIO && (disegna || Math.abs(e.clientX - x0) > 4)) {
      disegna = true;
      const a = frac({clientX: x0}), b = frac(e);
      if (Math.abs(b - a) < 0.001) return;
      LOOP = [Math.min(a, b), Math.max(a, b)];
      drawTl();
    } else if (!disegna) seekFrom(el, e);
  });
  addEventListener("mouseup", () => {
    // Finito di disegnare, l'ascolto riparte dall'inizio del loop.
    if (down && disegna && LOOP && view) vaiA(LOOP[0] * view.duration);
    down = false;
  });
}
document.getElementById("waveView").addEventListener("dblclick", () => {
  if (!SAMPLE_AUDIO || !LOOP) return;
  LOOP = null;
  drawTl();
});

// --- il ciclo: cursori + viste in tempo reale -----------------------------
const scopeC = document.getElementById("scope"), stereoC = document.getElementById("stereo");
const freqData = new Uint8Array(analyser.frequencyBinCount);
const bufL = new Float32Array(anL.fftSize), bufR = new Float32Array(anR.fftSize);

function drawScope() {
  const c = scopeC, g = c.getContext("2d"), W = c.width, H = c.height;
  analyser.getByteFrequencyData(freqData);
  const nyq = ctx.sampleRate / 2, binHz = nyq / freqData.length;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = getComputedStyle(document.body).color;
  g.beginPath();
  for (let x = 0; x < W; x++) {
    const f = FMIN * Math.pow(nyq / FMIN, x / W);      // x logaritmico in frequenza
    const v = freqData[Math.min(freqData.length - 1, Math.round(f / binHz))] / 255;
    const y = H - v * H;                                 // y = dinamica (0..-96 dB)
    if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
}

function drawStereo() {
  const c = stereoC, g = c.getContext("2d"), W = c.width, H = c.height;
  anL.getFloatTimeDomainData(bufL);
  anR.getFloatTimeDomainData(bufR);
  // Scia: invece di cancellare, si sbiadisce. Un goniometro senza scia e'
  // illeggibile a 60 fps.
  g.fillStyle = getComputedStyle(document.querySelector(".view")).backgroundColor;
  g.globalAlpha = .3; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  g.strokeStyle = "#888"; g.globalAlpha = .3;
  g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.moveTo(0, H / 2); g.lineTo(W, H / 2);
  g.stroke(); g.globalAlpha = 1;
  // Lissajous ruotato di 45 gradi: mono in verticale, fuori fase in
  // orizzontale. x = (R-L)/sqrt2, y = (L+R)/sqrt2.
  g.fillStyle = getComputedStyle(document.body).color;
  const k = Math.min(W, H) / 2 * 0.95, r2 = Math.SQRT1_2;
  for (let i = 0; i < bufL.length; i++) {
    const x = W / 2 + (bufR[i] - bufL[i]) * r2 * k;
    const y = H / 2 - (bufL[i] + bufR[i]) * r2 * k;
    g.fillRect(x, y, 1, 1);
  }
}

const curSpec = document.getElementById("curSpec"), curWave = document.getElementById("curWave");

function frame() {
  // Un solo valore letto una volta sola: i due cursori non possono divergere.
  if (view && view.duration) {
    const t = LP ? lpPos() : Math.max(0, audio.currentTime - (audio.paused ? 0 : latenza()));
    const p = (t / view.duration) * 100;
    curSpec.style.left = p + "%";
    curWave.style.left = p + "%";
  }
  if (!audio.paused) { drawScope(); drawStereo(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- divisore trascinabile ------------------------------------------------
const left = document.getElementById("left"), gutter = document.getElementById("gutter");
const SAVED = "graph.split";
try {
  const w = localStorage.getItem(SAVED);
  if (w) left.style.width = w;
} catch (e) { /* localStorage negato: si parte dal default */ }

gutter.addEventListener("mousedown", e => {
  e.preventDefault();
  document.body.classList.add("dragging");
  gutter.classList.add("drag");
  const move = ev => {
    const w = Math.min(innerWidth - 280, Math.max(220, ev.clientX));
    left.style.width = w + "px";
  };
  const up = () => {
    removeEventListener("mousemove", move);
    removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
    gutter.classList.remove("drag");
    try { localStorage.setItem(SAVED, left.style.width); } catch (e) {}
  };
  addEventListener("mousemove", move);
  addEventListener("mouseup", up);
});

// I canvas hanno una larghezza in pixel, non in percentuale: vanno ridisegnati
// quando la colonna cambia. La STFT no, quella e' in cache: si ridisegna e
// basta. Un frame di ritardo per non ricalcolare a ogni pixel del trascinamento.
let pending = false;
new ResizeObserver(() => {
  if (pending || !view) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    const specC = document.getElementById("spec"), waveC = document.getElementById("wave");
    specC.width = specC.parentNode.clientWidth;
    waveC.width = waveC.parentNode.clientWidth;
    drawSpec(specC, view);
    drawWave(waveC, view);
    const sc = document.getElementById("scope");
    sc.width = sc.parentNode.clientWidth;
  });
}).observe(document.getElementById("right"));

show(cur);
</script>
