name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Backend headless per l'export PDF della partitura (score_visualizer).
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout (repo principale + submodule engine)
        uses: actions/checkout@v4
        with:
          # PythonGranularEngine e' pubblico: il submodule si clona senza
          # credenziali proprie. Prima era privato e questo passo chiedeva un
          # PAT nel secret `ENGINE_PAT`, mai configurato in questo repo: ogni
          # run falliva qui, prima di arrivare ai test.
          submodules: recursive
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Dipendenze di sistema (libsndfile per soundfile)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Installa il pacchetto + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Esegui i test (suite veloce)
        run: python -m pytest

      # Gli e2e (issue #4) partono da uno study.yml su disco, passano per la
      # CLI e renderizzano audio vero. Quelli col render chiedono il submodule
      # engine, che il checkout qui sopra porta; senza, si skipperebbero.
      - name: Esegui i test end-to-end
        run: python -m pytest -m e2e
