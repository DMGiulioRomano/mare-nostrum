# gl-ls
# Studio 01 — densità, grana, pitch, distribuzione.
#
# Quattro assi sotto osservazione. In modalità `envelope` lo sweep produce un
# file per combinazione di assi, attraversando tutte le permutazioni dei valori
# con plateau e transizioni sincronizzate (ascolto in sequenza continua).

study_id: study01_grain_density
title: "Studio 01 — densità e grana (grain 300-1000ms)"
seed: 1988
# Cartella del corpus (relativa alla root del repo). Default: samples/
samples_dir: samples

# Stream base: SOLO i parametri che NON sono assi (campi obbligatori di stream e
# valori espliciti diversi dal default engine). I parametri-asse risolvono il
# loro valore a riposo da `axes.*.baseline` o dal default engine (single source
# of truth) — non vanno duplicati qui.
base:
  onset: 0
  # Durata (secondi) di questo stream: il processo la normalizza sui tempi dei
  # suoi envelope, e le varianti discrete la usano come durata dei file.
  duration: 30
  sample: silenzi.wav
  time_mode: normalized
  grain:
    envelope: hanning
  pointer:
    loop_unit: absolute
    speed_ratio: 0
sweep:
  mode: envelope
  plateau: 5
  transition: 2.5
  orderings:
    - [density, grain.duration]      # density lento, grain.duration veloce
    #- [grain.duration, density]      # grain.duration lento, density veloce
axes:
  interpolation: step
  density:
    ramp: {start: 1, stop: 10, step: 5}
    baseline: 20
  grain.duration:
    ramp: {start: .3, stop: 1, step: .025}
  distribution:
    ramp: {start: 0, stop: 1, step: .25}


# Spread condiviso dalle zone d'ombra: 7 punti di lettura del sample su
# base.pointer.start (secondi assoluti: pointer.loop_unit scavalca il
# time_mode:normalized dello stream solo per pointer.start/loop, vedi PGE
# src/pge/controllers/pointer_controller.py:174-186). Ogni stream che lo
# riattiva con `spread:` genera 7 cugini identici salvo il punto di lettura
# nel sample; nomi generati a indice (non configurabile), indice -> secondi:
#   1=0.1  2=0.25  3=0.4  4=0.55  5=0.8  6=0.915  7=1.1
spread:
  over:
    base.pointer.start.values: [0.1, 0.25, 0.4, 0.55, 0.8, 0.915, 1.1]

streams:
  # Zone d'ombra di grain.duration (riepilogo.md, ascolto 2026-07-05): 4 zone
  # rappresentative, ciascuna compartimentata su un sotto-range preciso di
  # density/grain.duration invece del prodotto cartesiano globale. Ogni zona
  # riattiva con `spread: {}` il blocco spread: globale (i 7 punti di lettura
  # condivisi, vedi sopra): dict vuoto eredita il blocco intero, un blocco
  # parziale lo ritocca via deep-merge — stesso meccanismo di `sweep: {}`.
  # `sweep: {}` esplicito riattiva l'inviluppo envelope (di default uno spread
  # nasce con sweep off, vive solo nello stack); dict vuoto eredita
  # mode/plateau/transition/orderings dal blocco sweep: globale, stessi
  # ordinamenti e timing di `base`.

  # Zona 1 — density 1-10: unico caso che include anche la transizione stretta
  # 0.001->0.0035 oltre al plateau di zona d'ombra 0.0035-0.005.
  zona_ombra_d01_10:
    axes.density.ramp.step: 1
    sweep: {}
    spread: {}

  # Zona 2 — density 10-20: zona d'ombra ~0.0032-0.0055.
  zona_ombra_d10_20:
    axes.density:
        ramp: {start: 10, stop: 20}            # 3 valori
    sweep: {}
    spread: {}

  # Zona 3 — density 25-50: zona d'ombra ~0.003-0.005, stabile su tutta la banda.
  zona_ombra_d25_50:
    axes.density:
        ramp: {start: 25, stop: 50}            # 6 valori
    sweep: {}
    spread: {}

  # Zona 4 — density 55-80: zona d'ombra piu' larga ~0.003-0.008, include
  # l'estensione oltre 0.008 ancora da verificare (riepilogo.md riga 28-29).
  # Ascoltata finora solo fino a density 60; density 80 ancora da sentire.
  zona_ombra_d55_80:
    axes.density:
        ramp: {start: 55, stop: 80}             # 2 valori
    sweep: {}
    spread: {}

  zona_ombra_d100_500:
    axes.density:
        ramp: {start: 100, stop: 500, step: 50}             # 2 valori
    sweep: {}
    spread: {}
