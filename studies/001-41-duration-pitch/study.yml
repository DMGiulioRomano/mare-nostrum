# gl-ls
# Studio della grana su 001-41_5-5_5.wav — il sample piu' ricorrente nel brano.
#
# Due assi: grain.duration x pitch.ratio. Tutto il resto e' fermo e preso da
# `stream2` di mare-nostrum.yml, cosi' che quello che si sente cambiare sia
# durata del grano e pitch su quel materiale.
#
#   make all-study STUDY=001-41-duration-pitch

study_id: 001-41-duration-pitch
title: "001-41 — grain.duration x pitch.ratio"
seed: 1441
samples_dir: samples

# Da mare-nostrum.yml, stream2. Escluso `grain.duration` (e' l'asse) e
# `grain.read_direction` (envelope scritto sul brano: qui falserebbe l'ascolto,
# resta al default 1).
base:
  onset: 0
  duration: 1000  # tetto: la durata vera la fissa sweep.transition (50 x 20s)
  sample: 001-41_5-5_5.wav   # crudo, peak -26 dBFS: compensato da volume: 6
  time_mode: normalized
  distribution_mode: uniform
  fill_factor: 4
  distribution: 1
  grain:
    duration_range: 0.001
    envelope: hanning
  pointer:
    start: 0
    speed_ratio: 0.1
    loop_unit: normalized
    offset_range: 0.01
    loop_start: 0
    # loop_end sincronizzato allo step di sweep (20s): a speed_ratio 0.1 il
    # pointer percorre l'intera finestra in loop_end_norm*5.5s/0.1 = 20s,
    # un ciclo completo per ogni gradino di pitch.ratio/grain.duration.
    loop_end: 0.363636363636
  pitch:
    range: 0.05
  pan: 0
  #pan_range: 360
  volume: 6

sweep:
  mode: envelope
  transition: 20   # tutti gli assi step -> durata = N * transition: 20s per gradino
  # grain.duration lento, pitch veloce: per ogni grana scorrono tutti i pitch.
  orderings:
    - [grain.duration, pitch.ratio]

axes:
  interpolation: step
  grain.duration:
    # Da 1 campione (floor dinamico, 1/48000 s) a mezzo secondo. Passo ×2
    # (ottava) fuori dalla banda 500-5000 Hz; dentro quella banda passo piu'
    # fitto (fino a ~x1.13) perche' li' la discriminazione di altezza
    # dell'orecchio e' piu' fine e un salto di ottava si sente come un buco.
    values: [0.000020833333333333333, 0.00004, 0.00008, 0.00016,
             0.00025, 0.00035, 0.0004, 0.00045, 0.0005, 0.0006, 0.0007, 0.0008, 0.0009, 0.001, 0.0014, 0.002,
             0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512]
  pitch.ratio:
    baseline: 0.2
    # 0.2 -> 1.0 in passi geometrici (ratio 5^(1/4) ~ 1.495): il pitch ratio
    # e' esponenziale, passi uguali all'orecchio = passi uguali in rapporto.
    values: [0.2, 0.299, 0.447, 0.669, 0.75, 0.9, 1.0]
