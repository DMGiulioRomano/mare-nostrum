# gl-ls
# Studio della grana su 001-41_5-5_5.wav — il sample piu' ricorrente nel brano.
#
# Due assi: pointer.speed_ratio x pitch.ratio. grain.duration e' fisso (preso
# a meta' della banda usata negli altri studi), cosi' che quello che si sente
# cambiare sia velocita' del pointer e pitch su quel materiale.
#
#   make all-study STUDY=001-41-speed-pitch

study_id: 001-41-speed-pitch
title: "001-41 — pointer.speed_ratio x pitch.ratio"
seed: 1441
samples_dir: samples

# Da mare-nostrum.yml, stream2. Escluso `pointer.speed_ratio` e `pitch.ratio`
# (sono gli assi) e `grain.read_direction` (envelope scritto sul brano: qui
# falserebbe l'ascolto, resta al default 1).
base:
  onset: 0
  duration: 1000  # tetto: la durata vera la fissa sweep.transition (50 x 20s)
  sample: 001-41_5-5_5.wav   # crudo, peak -26 dBFS: compensato da volume: 6
  time_mode: normalized
  distribution_mode: uniform
  fill_factor: 4
  distribution: 1
  grain:
    duration: 0.001
    duration_range: 0.001
    envelope: hanning
  pointer:
    start: 0
    loop_unit: normalized
    offset_range: 0.01
    loop_start: 0
    # ponytail: loop_end era sincronizzato allo step di sweep assumendo
    # speed_ratio fisso a 0.1. Qui speed_ratio e' l'asse quindi il sync varia
    # per gradino: valore lasciato cosi' com'era, da correggere ascoltando.
    loop_end: 0.363636363636
  pan: 0
  volume: 6

sweep:
  mode: envelope
  transition: 20   # tutti gli assi step -> durata = N * transition: 20s per gradino
  orderings:
    - [pointer.speed_ratio, pitch.ratio]
    - [pitch.ratio, pointer.speed_ratio]

axes:
  interpolation: step
  pointer.speed_ratio:
    baseline: 0.1
    # ponytail: placeholder geometrico x2 attorno al valore base (0.1), da
    # correggere ascoltando.
    values: [0.025, 0.05, 0.1, 0.2, 0.4, 0.8, 1.6]
  pitch.ratio:
    baseline: 0.2
    # 0.2 -> 1.0 in passi geometrici (ratio 5^(1/4) ~ 1.495): il pitch ratio
    # e' esponenziale, passi uguali all'orecchio = passi uguali in rapporto.
    values: [0.2, 0.299, 0.447, 0.669, 0.75, 0.9, 1.0]
