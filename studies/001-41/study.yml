# gl-ls
# Studio della grana su 001-41_5-5_5.wav — il sample piu' ricorrente nel brano.
#
# UNA coppia sola di assi interni — grain.duration x fill_factor — e tutto il
# resto a manopola. Prima le coppie erano cinque e cambiare pitch voleva dire
# cambiare griglia; ora la griglia e' sempre la stessa e pitch, speed,
# envelope sono selettori accanto a distribution e offset_range: si tiene
# ferma la cella e si gira una manopola sola.
#
#   COMBO=grain.envelope=hanning__pitch.ratio=1__pointer.speed_ratio=0.1__distribution=0.3__pointer.offset_range=0.001__grain.duration_range=0__pitch.range=0 make explore STUDY=001-41
#
# Senza COMBO le combinazioni sono 16 x 4 x 6 x 3 x 9 x 2 x 2 = 41472, a 120
# file da 8s l'una: irrealizzabile per intero, e non e' il modo di usarlo.
# Restringi SEMPRE con COMBO a una fetta che vuoi davvero ascoltare.

study_id: 001-41
title: "001-41 — matrice degli assi"
seed: 1441
samples_dir: samples

# Catalogo dei valori: le liste stanno qui una volta sola e sotto le riusano
# sia gli assi interni sia quelli esterni, per alias YAML (`*v_pitch`).
# Non e' una chiave del linguaggio, e' un magazzino: la pipeline la ignora.
_assi:
  duration:
    baseline: 0.05
    # Da 1 campione (floor dinamico, 1/48000 s) a mezzo secondo. Passo x2
    # (ottava) fuori dalla banda 500-5000 Hz; dentro quella banda passo piu'
    # fitto (fino a ~x1.13) perche' li' la discriminazione di altezza
    # dell'orecchio e' piu' fine e un salto di ottava si sente come un buco.
    values: &v_duration [0.000020833333333333333, 0.00004, 0.00008, 0.00016,
             0.00025, 0.00035, 0.0004, 0.00045, 0.0005, 0.0006, 0.0007, 0.0008,
             0.0009, 0.001, 0.0014, 0.002,
             0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512]
  pitch:
    baseline: 0.2
    # 0.2 -> 1.0 in passi geometrici (ratio 5^(1/4) ~ 1.495): il pitch ratio
    # e' esponenziale, passi uguali all'orecchio = passi uguali in rapporto.
    values: &v_pitch [0.2, 0.447, 0.75, 1.0]
  speed:
    baseline: 0.1
    # ponytail: placeholder geometrico x2 attorno al valore base (0.1), da
    # correggere ascoltando.
    values: &v_speed [0.025, 0.05, 0.1, 0.25, 0.5, 1]
  fill_factor:
    baseline: 2
    # ponytail: placeholder geometrico x2, da correggere ascoltando.
    values: &v_fill_factor [0.5, 0.7, 0.85, 1, 2]
  envelope:
    baseline: hanning
    # Asse categoriale: tutte le finestre del catalogo dell'engine
    # (WindowRegistry.WINDOWS) — 9 GEN20 simmetriche, half_sine (GEN09), 6
    # asimmetriche GEN16. L'alias `triangle` non c'e': e' bartlett.
    values: &v_envelope [hamming, hanning, bartlett, blackman, blackman_harris,
             gaussian, kaiser, rectangle, sinc,
             half_sine,
             expodec, expodec_strong, exporise, exporise_strong,
             rexpodec, rexporise]

# Da mare-nostrum.yml, stream2. Escluso `grain.read_direction` (envelope
# scritto sul brano: qui falserebbe l'ascolto, resta al default 1). I valori a
# riposo dei parametri che sono assi stanno qui: quando un asse li muove, la
# patch della combinazione li sovrascrive.
base:
  onset: 0
  duration: 8     # durata del singolo grano-file, in secondi
  sample: 001-41_5-5_5.wav   # crudo, peak -26 dBFS: compensato da volume: 12
  time_mode: normalized
  distribution_mode: uniform
  # fill_factor non e' scritto: e' asse interno, lo muove la griglia.
  grain:
    duration: 0.001          # a riposo: meta' della banda dell'asse
    envelope: hanning
  pointer:
    start: 0
    speed_ratio: 0.1         # a riposo
    loop_unit: normalized
    loop_start: 0
    # ponytail: loop_end era sincronizzato allo step di sweep assumendo
    # speed_ratio fisso a 0.1 (loop_end_norm*5.5s/speed_ratio = 20s). Ora
    # speed_ratio e' una manopola: il sync vale solo alla tacca 0.1. Valore
    # lasciato com'era, da correggere ascoltando.
    loop_end: 0.363636363636
  pitch:
    ratio: 1.0               # a riposo
  pan: 0
  volume: 12

sweep:
  # Un file per punto della griglia invece di un unico envelope lungo: il nome
  # del file porta le coordinate (o2__grain.duration=...__fill_factor=...) e
  # `graph` ne fa una rete navigabile. `orders: [2]` = solo la griglia piena,
  # niente varianti a un asse solo (le baseline non stanno nei values).
  mode: discrete
  orders: [2]

# L'unica coppia: la griglia della pagina, sempre questa.
axes:
  interpolation: step
  grain.duration:
    baseline: 0.05
    values: *v_duration
  fill_factor:
    baseline: 2
    values: *v_fill_factor

# --- assi esterni ----------------------------------------------------------
# Le manopole. Ognuna e' un selettore in cima alla pagina: la cella resta la
# stessa e cambia solo il parametro girato, cosi' il confronto e' un A/B sullo
# stesso punto della griglia. I primi tre erano assi interni delle vecchie
# coppie (duration-pitch, duration-speed, speed-pitch, duration-envelope).
for_each:
  base.grain.envelope: {values: *v_envelope}
  base.pitch.ratio: {values: *v_pitch}
  base.pointer.speed_ratio: {values: *v_speed}
  base.distribution: {values: [0, 0.3, 1]}
  # 0.0001 -> 0.01 in passi geometrici (~x3.16), infittiti a ~x1.33 sopra
  # 0.003: e' li' che si e' deciso di guardare da vicino.
  base.pointer.offset_range:
    values: [0, 0.0001, 0.000316, 0.001,
             0.00316, 0.0042, 0.0056, 0.0075, 0.01]
  base.grain.duration_range: {values: [0, 0.01]}
  base.pitch.range: {values: [0, 0.05]}
